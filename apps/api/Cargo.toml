[package]
name = "wsb-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "process"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
sha2 = "0.11"
jsonwebtoken = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
firestore = { version = "0.58.0", optional = true }
async_zip = { version = "0.0.19", optional = true, features = ["tokio"] }
tokio-stream = { version = "0.1", optional = true }
chrono-tz = "0.10.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
lopdf = { version = "=0.46.0", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[features]
firestore = ["dep:firestore", "dep:image", "dep:lopdf", "dep:libc"]
local-testing = ["firestore", "dep:async_zip", "dep:tokio-stream"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
